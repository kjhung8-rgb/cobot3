# Bridge: PoseStamped on /detected_survivor_pose -> RViz Marker /survivor_goal_marker.
survivor_pose_to_marker:
  ros__parameters:
    pose_subscription_topic: /detected_survivor_pose
    marker_publication_topic: /survivor_goal_marker
    survivor_delete_topic: /survivor_delete_id
    delete_marker_frame: map
    marker_half_size: 0.75
    marker_z_lift: 0.15
    label_z_lift: 0.8
    label_text_height: 0.45
    line_width: 0.12
    sphere_diameter: 0.4
    accumulate_markers: true
    log_each_pose: true
