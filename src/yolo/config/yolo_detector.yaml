yolo_detector:
  ros__parameters:
    image_topic: /spot_0/front_cam/color_image
    depth_topic: /spot_0/front_cam/depth_image
    camera_info_topic: /spot_0/front_cam/camera_info
    annotated_topic: /spot_0/yolo/annotated_image
    multi_camera: true
    camera_names: [front, left, right]
    image_topics:
      - /spot_0/front_cam/color_image
      - /spot_0/left_cam/color_image
      - /spot_0/right_cam/color_image
    depth_topics:
      - /spot_0/front_cam/depth_image
      - /spot_0/left_cam/depth_image
      - /spot_0/right_cam/depth_image
    camera_info_topics:
      - /spot_0/front_cam/camera_info
      - /spot_0/left_cam/camera_info
      - /spot_0/right_cam/camera_info
    annotated_topics:
      - /spot_0/yolo/annotated_image
      - /spot_0/yolo/left_annotated_image
      - /spot_0/yolo/right_annotated_image
    detected_topic: /spot_0/yolo/person_detected
    slowdown_required_topic: /spot_0/yolo/slowdown_required
    base_pose_topic: /spot_0/yolo/person_pose_base
    survivor_pose_topic: /detected_survivor_pose
    survivor_delete_topic: /survivor_delete_id
    base_frame: spot_0/base_link
    target_frame: map
    # 0.35로 유지 — 부분 가림(다리만/상반신만)도 잡아야 함. false positive는
    # threshold가 아닌 new_survivor_confirmations(아래)로 거름.
    confidence_threshold: 0.35
    device: cuda
    imgsz: 640
    inference_period_sec: 0.2
    annotated_publish_period_sec: 0.3
    person_only: true
    use_latest_tf: true
    tf_timeout_sec: 0.2
    sync_queue_size: 5
    sync_slop_sec: 0.08
    depth_sample_radius_px: 5
    min_depth_m: 0.2
    # warehouse 천장/뒷벽이 카메라에서 ~15m → 8m로 너무 빡빡하면 사람 bbox 안
    # 픽셀 상당수가 잘려나가 valid sample <20 (no valid person-depth sample 경고).
    # 12m면 ~10m까지 사람 인식하면서 멀리 있는 noisy wall은 여전히 차단.
    max_depth_m: 12.0
    pose_publish_period_sec: 1.0
    project_target_pose_to_ground: true
    optical_to_camera_link: true
    save_detection_images: true
    capture_dir: src/yolo/dectected_person
    capture_period_sec: 2.0
    capture_annotated: true
    # 같은 사람이 카메라 시점/depth noise로 1~2m jump 흔함.
    # 3m로 두면 같은 사람 perception noise 흡수, 다른 사람과 구별 가능.
    survivor_match_radius_m: 3.0
    candidate_match_radius_m: 2.0
    # 한 번 감지로 survivor 등록하면 false positive 그대로 좌표가 됨. 3번
    # 연속 검출 요구 → 진짜 사람만 통과 (단발성 오인 차단).
    new_survivor_confirmations: 3
    # 후보가 5초 동안 추가 confirmation 못 받으면 폐기 (이전 10s는 노이즈 누적).
    candidate_ttl_sec: 5.0
    depth_roi_x_min_ratio: 0.30
    depth_roi_x_max_ratio: 0.70
    depth_roi_y_min_ratio: 0.25
    depth_roi_y_max_ratio: 0.75
    depth_percentile: 25.0
    depth_cluster_tolerance_m: 0.45
    min_depth_samples: 20
