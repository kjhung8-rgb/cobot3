explore:
  ros__parameters:
    robot_base_frame: spot_0/base_link
    costmap_topic: /global_costmap/costmap
    costmap_updates_topic: /global_costmap/costmap_updates
    visualize: true
    planner_frequency: 0.33
    # ── TEST #3: 15s (sane mid-value) ──
    # 5s was too aggressive — real navigation got blacklisted before
    # finishing. 30s was too lenient — masked the instant-success stall.
    # 15s lets normal navigation finish but still catches genuine stuck.
    progress_timeout: 15.0
    # Cost weights for frontier selection.
    #   total_cost = potential_scale*distance - gain_scale*size
    #                                          - orientation_scale*alignment_with_robot_heading
    # Tuned for smoother coverage (less zigzag): reduced distance greediness,
    # higher reward for large unseen areas, strong preference for keeping the
    # robot moving in its current direction.
    potential_scale: 1.5
    orientation_scale: 1.5
    gain_scale: 1.5
    transform_tolerance: 0.5
    # ── TEST #5: reduced 2.0 → 0.5 ──
    # robot self-marking patch in camera_coverage_tracker pushes the
    # closest frontier to ~0.6 m+ (outside the 0.25 m goal tolerance),
    # so instant-success no longer needs filtering via a large
    # min_frontier_size. Smaller frontier qualification means more
    # candidates → less likely all get blacklisted.
    min_frontier_size: 0.5
