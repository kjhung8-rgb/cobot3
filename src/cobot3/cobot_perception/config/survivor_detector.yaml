survivor_detector:
  ros__parameters:
    image_topic: /spot_0/front_cam/color_image
    annotated_topic: /spot_0/yolo/annotated_image
    detected_topic: /spot_0/yolo/person_detected
    # Future: publish geometry_msgs/PoseStamped on /detected_survivor_pose from YOLO+TF.
    # survivor_pose_to_marker subscribes and draws the RViz X marker.
    confidence_threshold: 0.4
    device: cuda
    person_only: true
