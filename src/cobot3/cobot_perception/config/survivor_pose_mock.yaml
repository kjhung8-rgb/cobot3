survivor_pose_mock:
  ros__parameters:
    # Same topic name you plan to use when Spot + YOLO publishes the real pose.
    pose_topic: /detected_survivor_pose
    marker_topic: /survivor_goal_marker
    # Must match the TF / fixed frame Carter uses (often "map").
    frame_id: map
    x: 2.0
    y: 1.0
    z: 0.0
    yaw_deg: 0.0
    marker_half_size: 0.35
    publish_hz: 1.0
    log_each_publish: true
