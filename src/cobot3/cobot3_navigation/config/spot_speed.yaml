spot_speed:
  # Normal autonomous exploration command limits used by Nav2 MPPI.
  default_linear_mps: 2.2
  default_angular_radps: 1.9

  # Absolute command limits used by velocity_smoother and Isaac policy clamp.
  max_linear_mps: 2.4
  max_angular_radps: 2.4
  # Forward-only exploration: camera always faces direction of travel so we
  # don't re-scan already-covered area. velocity_smoother clamps reverse and
  # lateral to 0; controller also runs with motion_model=DiffDrive + vx_min=0.
  max_reverse_mps: 0.0
  max_lateral_mps: 0.0

  # Slowdown applied by cmd_vel_relay while YOLO is seeing a survivor.
  yolo_speed_factor: 0.3
  yolo_hold_sec: 2.0

  # Isaac Spot policy input scale. Keep this separate from ROS cmd_vel units.
  cmd_vel_to_policy_linear_x_scale: 2.0
  cmd_vel_to_policy_linear_y_scale: 2.0
  cmd_vel_to_policy_angular_z_scale: 2.0
