# Stage 2 — Carter AMCL only.
#
# `/**:` root key so params attach regardless of PushRosNamespace —
# without it, `amcl:` only matches a node named `/amcl`, not `/carter_0/amcl`.
#
# Carter shares the same ROS_DOMAIN_ID as spot; namespace isolation via
# /carter_0 keeps the two AMCL/SLAM stacks apart.

/**:
  ros__parameters:
    use_sim_time: False
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "carter_0/base_link"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 25.0
    laser_min_range: 0.4
    laser_model_type: "likelihood_field"
    max_beams: 360
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "carter_0/odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 3
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 3.0
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: /carter_0/scan_nav
    map_topic: /map
    # Carter spawn (24, 29) - spot spawn (21.5, 29) = (2.5, 0) in spot SLAM's
    # map frame (spot's start point is map origin). Tweak if spot SLAM origin
    # drifts.
    set_initial_pose: true
    initial_pose:
      x: 2.5
      y: 0.0
      z: 0.0
      yaw: 0.0
    always_reset_initial_pose: false
    first_map_only: false
